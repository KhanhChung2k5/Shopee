<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="/theme.js?v=1"></script>
  <title>Chợ Tốt Mua — Làm khảo sát</title>
  <meta name="application-name" content="crm-customer-survey">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;600;700&family=Fira+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/demo.css?v=48">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="/index.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1z"/>
          </svg>
        </span>
        <span class="brand-copy">
          <strong>Chợ Tốt Mua</strong>
          <small>CRM Demo</small>
        </span>
      </a>

      <p class="nav-label">Chung</p>
      <nav class="nav" aria-label="Điều hướng chính">
        <a class="nav-item" href="/index.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          Khách hàng
        </a>
        <a class="nav-item" href="/surveys.html">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          Khảo sát
        </a>
        <a class="nav-item is-active" href="/inbox.html" aria-current="page">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v12H5.17L4 17.17V4z"/><path d="M4 4l8 6 8-6"/></svg>
          Hộp thư khách
        </a>
      </nav>

      <section class="sidebar-panel">
        <h2>Đăng nhập khách</h2>
        <p class="hint">Mật khẩu trùng tên. Chỉ khách đã nhận thư và còn hoạt động mới mở được phiếu.</p>
        <div class="roles" id="roles"></div>
      </section>
    </aside>

    <div class="shell">
      <header class="topbar">
        <button class="icon-btn menu-btn" type="button" id="menu-toggle" aria-label="Mở menu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <p class="page-kicker">Khách trả lời khảo sát đã nhận trong hộp thư.</p>
        <p id="banner" class="attention" hidden role="status" aria-live="polite"></p>
        <button class="icon-btn" type="button" id="reload" aria-label="Tải lại phiếu">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
        </button>
        <div class="who-chip">
          <span class="who-avatar" aria-hidden="true">?</span>
          <p id="who">Chưa chọn khách</p>
        </div>
      </header>

      <main class="workspace">
        <div class="page-head">
          <a class="btn-ghost" href="/inbox.html">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Hộp thư
          </a>
          <h1>Làm khảo sát</h1>
        </div>
        <p id="meta" class="meta">Chọn khách bên trái.</p>
        <form id="sheet" class="survey-preview-card survey-fill" hidden></form>
      </main>
    </div>
  </div>
  <script src="/customer-survey.js?v=1"></script>
  <script src="/shell-nav.js?v=2"></script>
</body>
</html>
