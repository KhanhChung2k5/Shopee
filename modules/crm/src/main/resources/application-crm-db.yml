spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5434}/${DB_NAME:chotomua}?sslmode=${DB_SSLMODE:prefer}&prepareThreshold=0
    username: ${DB_USER:chotomua}
    password: ${DB_PASSWORD:chotomua}
    hikari:
      maximum-pool-size: 10
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    ignore-migration-patterns: "*:checksum"
