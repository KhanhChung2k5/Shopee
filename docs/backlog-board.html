<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#F5F5F7; --surface:#FFFFFF; --text:#1A1A1A; --muted:#6B7280; --border:#E7E7EA;
    --primary:#F0562E; --primary-dark:#D6431F; --primary-light:#FFE9E1;
    --trust:#16A34A; --trust-light:#E7F7ED;
    --urgent:#E11D48; --urgent-light:#FDECEF;
    --shadow: 0 1px 2px rgba(20,20,20,.06), 0 4px 14px rgba(20,20,20,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#16181C; --surface:#1F2126; --text:#F2F3F5; --muted:#9AA0AC; --border:#2B2E36;
      --primary:#FF7A52; --primary-dark:#FFB199; --primary-light:#3A2420;
      --trust:#4ADE80; --trust-light:#163826;
      --urgent:#FB7185; --urgent-light:#3A1720;
      --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    --bg:#16181C; --surface:#1F2126; --text:#F2F3F5; --muted:#9AA0AC; --border:#2B2E36;
    --primary:#FF7A52; --primary-dark:#FFB199; --primary-light:#3A2420;
    --trust:#4ADE80; --trust-light:#163826;
    --urgent:#FB7185; --urgent-light:#3A1720;
    --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:"Nunito Sans", system-ui, sans-serif;
    padding-inline:16px; padding-block:24px 48px;
  }
  h1,h2,h3,.num{ font-family:"Rubik", system-ui, sans-serif; }
  .wrap{ max-width:1080px; margin-inline:auto; }
  a{color:var(--primary)}

  header.top{ margin-bottom:24px; }
  header.top h1{ font-size:22px; font-weight:800; margin:0 0 4px; }
  header.top p{ margin:0; color:var(--muted); font-size:13.5px; }

  .overall{
    margin-top:16px; background:var(--surface); border:1px solid var(--border);
    border-radius:14px; padding:16px; box-shadow:var(--shadow);
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  }
  .overall .ring{ flex-shrink:0; }
  .overall .stat-label{ font-size:12px; color:var(--muted); }
  .overall .stat-value{ font-size:20px; font-weight:800; font-family:"Rubik", sans-serif; }
  .progress-bar{ flex:1; min-width:180px; height:10px; border-radius:999px; background:var(--border); overflow:hidden; }
  .progress-bar > div{ height:100%; background:var(--primary); border-radius:999px; transition:width .3s ease; }

  nav.tabs{
    display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:20px;
    border-bottom:1px solid var(--border);
  }
  nav.tabs button{
    font:inherit; font-weight:700; font-size:13px; white-space:nowrap;
    background:none; border:none; color:var(--muted); padding:10px 14px;
    cursor:pointer; border-bottom:2.5px solid transparent; margin-bottom:-1px;
  }
  nav.tabs button:hover{ color:var(--text); }
  nav.tabs button[aria-selected="true"]{ color:var(--primary); border-bottom-color:var(--primary); }
  nav.tabs button:focus-visible{ outline:2px solid var(--primary); outline-offset:2px; }

  .grid-cards{ display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:12px; margin-bottom:8px; }
  .p-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:16px; box-shadow:var(--shadow); cursor:pointer; text-align:left; font:inherit; color:inherit;
    display:flex; flex-direction:column; gap:8px;
  }
  .p-card:hover{ border-color:var(--primary); }
  .p-card .name{ font-weight:800; font-size:14px; }
  .p-card .role{ font-size:12px; color:var(--muted); }
  .p-card .pct{ font-family:"Rubik",sans-serif; font-weight:800; font-size:22px; color:var(--primary-dark); }
  .dep-box{
    background:var(--primary-light); border-radius:12px; padding:12px 14px; font-size:12.5px;
    color:var(--text); margin-bottom:20px; display:flex; gap:10px; align-items:flex-start;
  }
  .dep-box svg{ flex-shrink:0; margin-top:1px; color:var(--primary-dark); }

  section.category{ margin-bottom:24px; }
  section.category > h3{
    font-size:13px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted);
    margin:0 0 10px; display:flex; align-items:center; gap:8px;
  }
  section.category > h3 .count{ font-weight:400; text-transform:none; letter-spacing:0; }
  ul.tasklist{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px; }
  ul.tasklist li{
    display:flex; align-items:flex-start; gap:10px; background:var(--surface);
    border:1px solid var(--border); border-radius:10px; padding:10px 12px;
  }
  ul.tasklist li.done{ opacity:.6; }
  ul.tasklist input[type="checkbox"]{
    width:20px; height:20px; margin:1px 0 0; accent-color:var(--trust); flex-shrink:0; cursor:pointer;
  }
  ul.tasklist label{ flex:1; font-size:13.5px; line-height:1.45; cursor:pointer; }
  ul.tasklist li.done label{ text-decoration:line-through; }
  .phase-tag{
    font-size:10.5px; font-weight:700; padding:2px 7px; border-radius:999px;
    background:var(--trust-light); color:var(--trust); white-space:nowrap; flex-shrink:0;
  }

  .empty-note, .offline-note{
    text-align:center; color:var(--muted); padding:32px 16px; font-size:13px;
  }
  .offline-note{ background:var(--urgent-light); color:var(--urgent); border-radius:12px; margin-bottom:16px; }
</style>

<div class="wrap">

  <nav class="tabs" id="tabs" role="tablist" aria-label="Chọn người phụ trách"></nav>
  <div id="panel"></div>
</div>

    { id:"p5-18", person:"p5", category:"Web", phase:"Phase 5", title:"Khung chat buyer-công ty", done:false },

    { id:"p5-25", person:"p5", category:"API", phase:"Phase 5", title:"API tạo Survey + câu hỏi (admin/CRM)", done:false },
    { id:"p5-26", person:"p5", category:"API", phase:"Phase 5", title:"API gửi Survey tới CustomerSegment (qua Campaign) → sinh Notification", done:false },

    { id:"p5-30", person:"p5", category:"API", phase:"Phase 5", title:"API báo cáo demographic khách hàng (độ tuổi, giới tính, ngành hàng ưa thích)", done:false },
    { id:"p5-31", person:"p5", category:"Web", phase:"Phase 5", title:"Trang tạo/quản lý Survey + xem thống kê (admin)", done:false },
    { id:"p5-32", person:"p5", category:"Web", phase:"Phase 5", title:"Trang khách hàng thực hiện khảo sát", done:false },

    { id:"p5-34", person:"p5", category:"Test", phase:"Phase 5", title:"Unit test: xóa mềm chỉ đổi status, dữ liệu và lịch sử đơn hàng vẫn còn nguyên", done:false },

    { id:"p2-22", person:"p2", category:"API", phase:"Phase 6", title:"Bảo mật & validate input cho API domain Catalog", done:false },
    { id:"p2-23", person:"p2", category:"Mobile", phase:"Phase 6", title:"Nối mobile: trang chủ (danh mục, sản phẩm) + trang chi tiết sản phẩm dùng API thật", done:false },
    { id:"p2-24", person:"p2", category:"Test", phase:"Phase 6", title:"Test tích hợp: Catalog → Cart (thêm sản phẩm thật vào giỏ hàng)", done:false },
    { id:"p3-19", person:"p3", category:"API", phase:"Phase 6", title:"Bảo mật & validate input cho API domain Order", done:false },

    { id:"p3-21", person:"p3", category:"Test", phase:"Phase 6", title:"Test tích hợp: Cart → Order → Shipment end-to-end thật", done:false },
    { id:"p4-22", person:"p4", category:"API", phase:"Phase 6", title:"Bảo mật & validate input cho API domain Payment/Marketing", done:false },
    { id:"p4-23", person:"p4", category:"Mobile", phase:"Phase 6", title:"Nối mobile: ví, voucher, flash sale, đánh giá sản phẩm dùng API thật", done:false },
    { id:"p4-24", person:"p4", category:"Test", phase:"Phase 6", title:"Test tích hợp: Order → Payment → Refund end-to-end thật", done:false },
    { id:"p5-36", person:"p5", category:"API", phase:"Phase 6", title:"Bảo mật & validate input cho API domain CRM", done:false },
    { id:"p5-37", person:"p5", category:"Mobile", phase:"Phase 6", title:"Nối mobile: hỗ trợ, tin nhắn, thông báo dùng API thật", done:false },
    { id:"p5-38", person:"p5", category:"Test", phase:"Phase 6", title:"Test tích hợp: Order → Conversation(ticket)/SurveyResponse(NPS), Campaign → Notification", done:false }
  ];

  var CATEGORY_ORDER = ["Hạ tầng", "Entity", "API", "Web", "Mobile", "Test"];

  var state = { tasks: null, offline: false, current: "overview" };
  var db = null;

  function byId(id){ return document.getElementById(id); }

  function computeProgress(tasks, personId){
    var list = personId ? tasks.filter(function(t){ return t.person === personId; }) : tasks;
    var done = list.filter(function(t){ return t.done; }).length;
    return { done: done, total: list.length, pct: list.length ? Math.round(done / list.length * 100) : 0 };
  }

  function renderTabs(){
    var nav = byId("tabs");
    nav.innerHTML = "";
    PEOPLE.forEach(function(p){
      var btn = document.createElement("button");
      btn.type = "button";
      btn.setAttribute("role", "tab");
      btn.setAttribute("aria-selected", String(p.id === state.current));
      btn.textContent = p.label;
      btn.addEventListener("click", function(){ state.current = p.id; render(); });
      nav.appendChild(btn);
    });
  }

  function svgInfo(){
    return '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.6"/><path d="M12 8h.01M11 11h1v6h1" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function renderOverview(tasks){
    var panel = byId("panel");
    var html = '<div class="grid-cards">';
    PEOPLE.slice(1).forEach(function(p){
      var prog = computeProgress(tasks, p.id);
      html += '<button class="p-card" type="button" data-goto="' + p.id + '">' +
        '<div class="name">' + p.label + '</div>' +
        '<div class="role">' + p.role + '</div>' +
        '<div class="pct">' + prog.pct + '%</div>' +
        '<div class="progress-bar"><div style="width:' + prog.pct + '%"></div></div>' +
        '<div class="role">' + prog.done + '/' + prog.total + ' việc</div>' +
        '</button>';
    });
    html += '</div>';
    panel.innerHTML = html;
    panel.querySelectorAll('[data-goto]').forEach(function(el){
      el.addEventListener('click', function(){ state.current = el.getAttribute('data-goto'); render(); });
    });
  }

  function renderPerson(tasks, personId){
    var panel = byId("panel");
    var personTasks = tasks.filter(function(t){ return t.person === personId; });
    var html = '';

    if (DEPENDENCY_NOTE[personId]) {
      html += '<div class="dep-box">' + svgInfo() + '<div>' + DEPENDENCY_NOTE[personId] + '</div></div>';
    }

    CATEGORY_ORDER.forEach(function(cat){
      var items = personTasks.filter(function(t){ return t.category === cat; });
      if (!items.length) return;
      var doneCount = items.filter(function(t){ return t.done; }).length;
      html += '<section class="category">';
      html += '<h3>' + cat + ' <span class="count">(' + doneCount + '/' + items.length + ')</span></h3>';
      html += '<ul class="tasklist">';
      items.forEach(function(t){
        html += '<li class="' + (t.done ? 'done' : '') + '" data-id="' + t.id + '">' +
          '<input type="checkbox" id="chk-' + t.id + '" ' + (t.done ? 'checked' : '') + (state.offline ? ' disabled' : '') + '>' +
          '<label for="chk-' + t.id + '">' + t.title + '</label>' +
          '<span class="phase-tag">' + t.phase + '</span>' +
          '</li>';
      });
      html += '</ul></section>';
    });

    panel.innerHTML = html || '<p class="empty-note">Chưa có việc nào.</p>';

    panel.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
      cb.addEventListener('change', function(){
        var li = cb.closest('li');
        var id = li.getAttribute('data-id');
        toggleTask(id, cb.checked, li);
      });
    });
  }

  function toggleTask(id, nextDone, liEl){
    liEl.classList.toggle('done', nextDone);
    if (!db) return;
    db.doc('tasks/' + id).update({ done: nextDone }).catch(function(){
      // No write permission or transient error: revert the visual state.
      liEl.classList.toggle('done', !nextDone);
      var cb = liEl.querySelector('input[type="checkbox"]');
      if (cb) cb.checked = !nextDone;
    });
  }

  function render(){
    renderTabs();
    var tasks = state.tasks || SEED_TASKS;
    if (state.current === 'overview') {
      renderOverview(tasks);
    } else {
      renderPerson(tasks, state.current);
    }
    var overall = computeProgress(tasks, null);
    byId('overall-value').textContent = overall.done + ' / ' + overall.total + ' việc (' + overall.pct + '%)';
    byId('overall-bar').style.width = overall.pct + '%';
  }

  function boot(){
    render();
    if (!window.claude || !window.claude.use) {
      state.offline = true;
      byId('offline-banner').hidden = false;
      render();
      return;
    }
    window.claude.use('db').then(function(handle){
      if (!handle) {
        state.offline = true;
        byId('offline-banner').hidden = false;
        render();
        return;
      }
      db = handle;
      db.collection('tasks').onSnapshot(function(snap){
        var list = snap.docs.map(function(d){
          var data = d.data() || {};
          return {
            id: d.id,
            person: data.person,
            category: data.category,
            phase: data.phase,
            title: data.title,
            done: !!data.done,
          };
        });
        if (list.length) state.tasks = list;
        render();
      }, function(){
        state.offline = true;
        byId('offline-banner').hidden = false;
        render();
      });
    }).catch(function(){
      state.offline = true;
      byId('offline-banner').hidden = false;
      render();
    });
  }

  boot();
})();
</script>
