server:
  port: 8080

spring:
  application:
    name: backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5434}/${DB_NAME:chotomua}
    username: ${DB_USER:chotomua}
    password: ${DB_PASSWORD:chotomua}
  jpa:
    hibernate:
      # Flyway owns the schema (db/migration/*.sql); Hibernate only checks
      # that @Entity classes match it, never auto-generates/alters tables.
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  # Dev-only default secret — override via JWT_SECRET env var in production.
  secret: ${JWT_SECRET:dev-only-secret-change-me-in-production-please-1234567890}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
