<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;500;600;700;800&family=Be+Vietnam+Pro:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <title>Chợ Tốt Mua</title>
    <script>
      // Set data-theme before first paint to avoid a light-mode flash.
      try {
        var t = localStorage.getItem('chotomua-theme');
        document.documentElement.dataset.theme = (t === 'light' || t === 'dark') ? t : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
